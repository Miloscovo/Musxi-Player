name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cloud-adapter:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/package-lock.json

      - name: Install dependencies
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm.cmd test
