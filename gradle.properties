# Keep the daemon's native charset for JDK 17 Windows argument files.
# Source compilation and test content explicitly use UTF-8 in build.gradle.kts.
org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The standalone workspace intentionally has a Chinese directory name.
# Build and tests are verified on Windows; this project has no NDK build.
android.overridePathCheck=true
